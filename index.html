  <script>
    if ('serviceWorker' in navigator) {
      var isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0';
      if (isDev) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
        });
      } else {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Batimove OS ServiceWorker registered:', reg.scope);
            try { reg.update(); } catch(e) {}
            reg.onupdatefound = function() {
              var worker = reg.installing;
              if (worker) {
                worker.onstatechange = function() {
                  if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('Nouvelle version Batimove OS disponible. Actualisation automatique...');
                    window.location.reload();
                  }
                };
              }
            };
          }).catch(function(err) {
            console.log('Batimove OS ServiceWorker registration failed:', err);
          });
        });
      }
    }
  </script>
